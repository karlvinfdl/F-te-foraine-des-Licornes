<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Badge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-cardPM" style="background: url('img/socles.png') center/cover fixed; min-height: 100vh; margin: 0; padding: 0;">

  <div class="ach-containerPM" style="display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; max-width: 1100px; margin: 140px auto 140px; padding: 40px;">

    <!-- ROUE 1 -->
    <div style="text-align: center; flex: 1; min-width: 280px;">
      <h2 style="color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.5); margin-bottom: 20px;">🌀 Roue 1</h2>
      <div class="ach-gridPM" style="gap: 20px;">
        <div class="ach-cardPM wheel1-bronzePM" style="width: 200px; height: 200px; margin: 20px auto;">
          <div class="ach-flipPM">
            <div class="ach-facePM ach-frontPM"><img src="img/badgebronzeavant.png" alt="Bronze Roue 1"></div>
            <div class="ach-facePM ach-backPM"><img src="img/badgebronzearriere.png" alt="Bronze Roue 1 verso"></div>
          </div>
        </div>
        <div class="ach-cardPM wheel1-argentPM" style="width: 200px; height: 200px; margin: 20px auto;">
          <div class="ach-flipPM">
            <div class="ach-facePM ach-frontPM"><img src="img/badgeargavant.png" alt="Argent Roue 1"></div>
            <div class="ach-facePM ach-backPM"><img src="img/badgeargarriere.png" alt="Argent Roue 1 verso"></div>
          </div>
        </div>
        <div class="ach-cardPM wheel1-diamantPM" style="width: 200px; height: 200px; margin: 20px auto;">
          <div class="ach-flipPM">
            <div class="ach-facePM ach-frontPM"><img src="img/badgediamavant.png" alt="Diamant Roue 1"></div>
            <div class="ach-facePM ach-backPM"><img src="img/badgediamantarr.png" alt="Diamant Roue 1 verso"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ROUE 2 -->
    <div style="text-align: center; flex: 1; min-width: 280px;">
      <h2 style="color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.5); margin-bottom: 20px;">🎵 Roue 2 (Blind Test)</h2>
      <div class="ach-gridPM" style="gap: 20px;">
        <div class="ach-cardPM wheel2-bronzePM" style="width: 200px; height: 200px; margin: 20px auto;">
          <div class="ach-flipPM">
            <div class="ach-facePM ach-frontPM"><img src="img/badgebronzeavant.png" alt="Bronze Roue 2"></div>
            <div class="ach-facePM ach-backPM"><img src="img/badgebronzearriere.png" alt="Bronze Roue 2 verso"></div>
          </div>
        </div>
        <div class="ach-cardPM wheel2-argentPM" style="width: 200px; height: 200px; margin: 20px auto;">
          <div class="ach-flipPM">
            <div class="ach-facePM ach-frontPM"><img src="img/badgeargavant.png" alt="Argent Roue 2"></div>
            <div class="ach-facePM ach-backPM"><img src="img/badgeargarriere.png" alt="Argent Roue 2 verso"></div>
          </div>
        </div>
        <div class="ach-cardPM wheel2-diamantPM" style="width: 200px; height: 200px; margin: 20px auto;">
          <div class="ach-flipPM">
            <div class="ach-facePM ach-frontPM"><img src="img/badgediamavant.png" alt="Diamant Roue 2"></div>
            <div class="ach-facePM ach-backPM"><img src="img/badgediamantarr.png" alt="Diamant Roue 2 verso"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ROUE 3 -->
    <div style="text-align: center; flex: 1; min-width: 280px;">
      <h2 style="color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.5); margin-bottom: 20px;">⭐ Roue 3 (Stand)</h2>
      <div class="ach-gridPM" style="gap: 20px;">
        <div class="ach-cardPM wheel3-bronzePM" style="width: 200px; height: 200px; margin: 20px auto;">
          <div class="ach-flipPM">
            <div class="ach-facePM ach-frontPM"><img src="img/badgebronzeavant.png" alt="Bronze Roue 3"></div>
            <div class="ach-facePM ach-backPM"><img src="img/badgebronzearriere.png" alt="Bronze Roue 3 verso"></div>
          </div>
        </div>
        <div class="ach-cardPM wheel3-argentPM" style="width: 200px; height: 200px; margin: 20px auto;">
          <div class="ach-flipPM">
            <div class="ach-facePM ach-frontPM"><img src="img/badgeargavant.png" alt="Argent Roue 3"></div>
            <div class="ach-facePM ach-backPM"><img src="img/badgeargarriere.png" alt="Argent Roue 3 verso"></div>
          </div>
        </div>
        <div class="ach-cardPM wheel3-diamantPM" style="width: 200px; height: 200px; margin: 20px auto;">
          <div class="ach-flipPM">
            <div class="ach-facePM ach-frontPM"><img src="img/badgediamavant.png" alt="Diamant Roue 3"></div>
            <div class="ach-facePM ach-backPM"><img src="img/badgediamantarr.png" alt="Diamant Roue 3 verso"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const fautesWheel1 = parseInt(localStorage.getItem('fautesWheel1') || '0');
      showBadge('.wheel1-bronzePM', '.wheel1-argentPM', '.wheel1-diamantPM', fautesWheel1, 'Roue 1');
      
      const fautesWheel2 = parseInt(localStorage.getItem('fautesWheel2') || '0');
     showBadge('.wheel2-bronzePM', '.wheel2-argentPM', '.wheel2-diamantPM', fautesWheel2, 'Roue 2');
      const fautesWheel3 = parseInt(localStorage.getItem('fautesWheel3') || '0');
    showBadge('.wheel3-bronzePM', '.wheel3-argentPM', '.wheel3-diamantPM', fautesWheel3, 'Roue 3');
      function showBadge(bronzeSel, argentSel, diamSel, fautes, nomRoue) {
        const bronze = document.querySelector(bronzeSel);
        const argent = document.querySelector(argentSel);
        const diam = document.querySelector(diamSel);
        [bronze, argent, diam].forEach(card => card.style.display = 'none');
        
        if (fautes === 0 && diam) diam.style.display = 'block';
        else if (fautes === 1 && argent) argent.style.display = 'block';
        else if (fautes >= 2 && bronze) bronze.style.display = 'block';
        console.log(nomRoue + ': ' + (fautes === 0 ? 'Diamant' : fautes === 1 ? 'Argent' : 'Bronze (' + fautes + ')'));
      }
      
      const resetBtn = document.createElement('button');
      resetBtn.textContent = '🔄 Rejouer';
      resetBtn.style.cssText = 'position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 15px 40px; font-size: 20px; font-weight: bold; background: linear-gradient(135deg, #ff6b6b, #ee5a52); color: white; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 10px 30px rgba(255,107,107,0.4); transition: all 0.3s; z-index: 1000;';
      resetBtn.onclick = () => {
        if (confirm('Reset stats et rejouer?')) {
          localStorage.clear();
          location.href = 'index.html';
        }
      };
      resetBtn.onmouseover = () => resetBtn.style.transform = 'translateX(-50%) translateY(-3px) scale(1.05)';
      resetBtn.onmouseout = () => resetBtn.style.transform = 'translateX(-50%)';
      document.body.appendChild(resetBtn);
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
