<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Roulette des Licornes - Jeu</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="page-wheelPM"> <div class="volume-controlPM">
    <label for="volumeSlider">🔊 Volume</label>
    <input type="range" id="volumeSlider" min="0" max="100" value="50">
    <span id="volumeValue">50%</span>
  </div>

  <div class="scenePM" id="scene">
    
    <audio id="spinSound" preload="auto">
      <source src="sound/LUCKY WHEEL SPIN SOUND EFFECTS  Copyright Free.mp3" type="audio/mpeg">
    </audio>
  
    <div class="gamePM" id="wheelZone">
      <div class="arrowPM" aria-hidden="true">
        <svg viewBox="0 0 50 40" xmlns="http://www.w3.org/2000/svg">
          <path d="M25 40 L0 10 L12 10 L12 0 L38 0 L38 10 L50 10 Z" 
                fill="#ffffff" 
                stroke="#7a1f73" 
                stroke-width="2"
                stroke-linejoin="round"/>
        </svg>
      </div>

      <div class="wheel-wrapPM">
        <svg id="wheel" viewBox="0 0 200 200" role="img" aria-label="Roue de jeu">
          <g id="segments"></g>
          
          <circle cx="100" cy="100" r="48" fill="#ffffff" />
          <text x="100" y="95" text-anchor="middle" font-size="11" font-weight="800" fill="#7a1f73">
            LA ROUE DES
          </text>
          <text x="100" y="112" text-anchor="middle" font-size="11" font-weight="800" fill="#7a1f73">
            LICORNES
          </text>
        </svg>
      </div>

      <button id="spin" class="spin spinPM">LANCER !</button>
      
      <div id="result" class="result"></div>
    </div>

    <aside class="panelPM" id="panel" aria-hidden="true">
      
      <div class="heartsPM"></div>

      <h2 style="text-align: center; color: #7a1f73; font-size: 1.2rem; margin-bottom: 10px;">Challenge !</h2>

      <div class="panel-cardPM" id="questionText">Prêt pour la question ?</div>

      <div class="panel-cardPM" id="answersContainer"></div>

      <div class="panel-cardPM" id="feedbackText" style="font-weight: 800;"></div>

      <div id="blindTestPhase" class="panel-cardPM" style="display: none;">
        <div class="timer-containerPM">
          <div id="blindTestTimer" class="timer-barPM"></div>
        </div>
        <div id="blindTestQuestion" style="font-weight: 800; margin-top: 10px;">Écoutez bien...</div>
      </div>

    </aside>
  </div>

  <script src="script.js"></script>

</body>
</html>
